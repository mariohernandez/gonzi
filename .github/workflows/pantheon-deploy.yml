name: Deploy to Pantheon

# Pushes main to Pantheon's master branch, which feeds the Dev environment.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two pushes to Pantheon at the same time.
concurrency:
  group: pantheon-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The action checks for these and fails without them.
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout code
        # Keep the default shallow clone. The action runs
        # "git fetch --unshallow" itself, which fails on a full clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Push to Pantheon
        uses: pantheon-systems/push-to-pantheon@3d790c6011304958b4b7ee18946581e7ff3bfcc1 # 0.9.7
        with:
          ssh_key: ${{ secrets.PANTHEON_PRIVATE_SSH_KEY }}
          machine_token: ${{ secrets.PANTHEON_MACHINE_TOKEN }}
          site: gonzi
          # Plain git push to Dev; no Build Tools plugin or content cloning.
          skip_build_tools: true

      # push-to-pantheon reports success even when its push fails,
      # so check that Pantheon's master now points at this commit.
      - name: Verify Pantheon received the commit
        env:
          PANTHEON_SITE: gonzi
        run: |
          site_id=$(terminus site:info "$PANTHEON_SITE" --field=id)
          remote="ssh://codeserver.dev.${site_id}@codeserver.dev.${site_id}.drush.in:2222/~/repository.git"
          pantheon_sha=$(git ls-remote "$remote" refs/heads/master | cut -f1)
          if [ "$pantheon_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Pantheon master is at '${pantheon_sha:-unknown}', expected $GITHUB_SHA. See the Push to Pantheon step log."
            exit 1
          fi
          echo "Pantheon master is at $GITHUB_SHA."
